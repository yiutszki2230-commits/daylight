<!doctype html>
<html lang="zh-Hant-HK">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#193c54"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="每日最多三件 To-do，留一點 Can-do 的空間。可離線使用的輕量日常規劃。"><title>Daylight｜今日一小步</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./ds037.css"><script defer src="./engine.js"></script><script defer src="./app.js"></script></head>
<body>
<div class="shell">
<header class="topbar"><a href="#today" class="brand" aria-label="Daylight 首頁"><span class="brand-mark">d.</span><span>daylight<span class="brand-sub">留一點空間，俾今日。</span></span></a><span id="connection" class="connection">本機保存</span></header>
<div id="storage-warning" class="notice warning" hidden>瀏覽器暫時未能保存資料。請先匯出備份，避免關閉後遺失。</div>
<main id="main" tabindex="-1"></main>
<footer class="footer">小步完成。探索隨心。<span>你的進度保存在這個瀏覽器。</span></footer>
</div>
<nav class="bottom-nav" aria-label="主要選單"><a href="#today" data-nav="today"><span aria-hidden="true">◒</span>今天</a><a href="#list" data-nav="list"><span aria-hidden="true">☷</span>全部清單</a><a href="#settings" data-nav="settings"><span aria-hidden="true">⚙</span>設定與備份</a></nav>
<dialog id="editor"><form id="edit-form"><div class="dialog-top"><div><span class="eyebrow">ONE SMALL STEP</span><h2 id="editor-title">新增一小步</h2></div><button type="button" class="icon-button" id="close-editor" aria-label="關閉">×</button></div><input type="hidden" name="id"><label>放在哪裡<select name="type"><option value="todo">To-do｜需要做</option><option value="cando">Can-do｜想試試</option><option value="waiting">等待回覆</option><option value="exam">考試</option><option value="homework">功課限期</option><option value="milestone">重要日期</option></select></label><label>名稱<input name="title" maxlength="240" required placeholder="例如：完成這週功課初稿"></label><div class="form-grid"><label>專案／科目<input name="project" maxlength="80" placeholder="例如：ACCT 3010"></label><label>預計分鐘<input name="minutes" type="number" min="5" max="480" value="20" required></label></div><div class="form-grid"><label>限期（可留空）<input name="date" type="date"></label><label>時間（可留空）<input name="time" type="time"></label></div><label>第一步<textarea name="step" rows="2" maxlength="5000" placeholder="寫到自己知道點開始"></textarea></label><label>做到哪裡可以停<input name="finish" maxlength="5000" placeholder="例如：做完三題並訂正"></label><label>備註<textarea name="note" rows="2" maxlength="5000"></textarea></label><button class="button primary full" type="submit">儲存這一步</button><button class="button danger full" type="button" id="archive-item" hidden>移到暫存</button><p id="edit-error" class="error" role="alert"></p></form></dialog>
<input id="import-file" type="file" accept=".json,application/json" hidden><div id="toast" class="toast" role="status" aria-live="polite"></div>
</body></html>
